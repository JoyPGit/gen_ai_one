server:
  port: 8081

app:
  rag:
    force-rebuild: true
    top-k: 4
    similarity-threshold: 0
    chunk:
      size: 800
      min-chunk-size: 200
      min-chunk-to-embed: 50
      max-num-chunks: 8192
      keep-separator: true
spring:
  application:
    name: gen-ai-java-spring
  datasource:
    url: jdbc:postgresql://localhost:5433/postgres?currentSchema=public&binaryTransfer=true&reWriteBatchedInserts=true&stringtype=unspecified
    username: postgres
    password: postgres
#  sql:
#    init:
#      mode: always
#      data-locations: classpath:/db/data.sql
  ai:
    chat:
      memory:
        repository:
          jdbc:
            # for local/dev , let Spring AI create automatically always
            initialize-schema: always
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        max-document-batch-size: 10_000
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-6-luna #can use same as what is for the api key on openai webpage
          reasoning-effort: none
#      embedding:
#        options:
#          model: text-embedding-3-small
#     for docker model runner
#      api-key: dummy_string #${OPENAI_API_KEY}
#      base-url: http://localhost:12434/engines/llama.cpp/v1 # using docker url
#      chat:
#        options:
#          model: hf.co/bartowski/google_gemma-3-1b-it-gguf:q4_k_m

#    ollama:
#      base-url: http://localhost:11434
#      chat:
#        options:
#          model: qwen3.5:4b # ollama list
#          max-new-tokens: 512
#          temperature: 0.7

logging:
  level:
    root: INFO
    org.springframework.ai:
      openai: TRACE
      chat.client.advisor.SimpleLoggerAdvisor: DEBUG
    com.openai: DEBUG
    okhttp3: DEBUG

