server:
  port: 8081

app:
  rag:
    force-rebuild: true
    top-k: 4
    similarity-threshold: 0
    radius: 1 # first level neighbours
    chunk:
      size: 800
      min-chunk-size: 200
      min-chunk-to-embed: 50
      max-num-chunks: 8192
      keep-separator: true
    pdf:
      mode: page # paragraph
      path: file:/Users/swagatpatra/Desktop/WORK/AI/rag-files/*.pdf
      pages-per-document: 1 # imp
      left-alignment: true
      number-of-text-lines-to-delete: 0
      number-of-bottom-text-lines-to-delete: 0
    synonyms:
      PTO: "paid time off"
      SSO: "single sign-on"
      MFA: "multi-factor authentication"
      2FA: "two-factor authentication"
      IaC: "infrastructure as code"
      PII: "personal data"
      CI/CD: "continuous integration and delivery"
      NAT: "network address translation"
      GDPR: "data protection regulation"
      VPN: "virtual private network"
      SDLC: "software development lifecycle"
      DNS: "domain name system"
      IP: "internet protocol"
      API: "application programming interface"
      SDK: "software development kit"
      UI: "user interface"
      UX: "user experience"
      DB: "database"
      SQL: "structured query language"
      NoSQL: "non-relational database"
      OS: "operating system"
      SSH: "secure shell"
      HTTP: "hypertext transfer protocol"
      HTTPS: "secure hypertext transfer protocol"
spring:
  application:
    name: gen-ai-java-spring
  datasource:
    url: jdbc:postgresql://localhost:5433/postgres?currentSchema=public&binaryTransfer=true&reWriteBatchedInserts=true&stringtype=unspecified
    username: postgres
    password: postgres
#  sql:
#    init:
#      mode: always
#      data-locations: classpath:/db/data.sql
  ai:
    chat:
      memory:
        repository:
          jdbc:
            # for local/dev , let Spring AI create automatically always
            initialize-schema: always
    vectorstore:
      pgvector:
        table-name-for-chat-memory: vector_store # default
        table-name-for-rag: rag_vector_store # default
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        max-document-batch-size: 10_000
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-6-luna #can use same as what is for the api key on openai webpage
          reasoning-effort: none
#      embedding:
#        options:
#          model: text-embedding-3-small
###     for docker model runner
